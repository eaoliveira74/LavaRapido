<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sistema de Agendamento - Lava Rápido Versátil</title>
    <script>
      // One-time unregister service workers and clear caches to avoid stale bundles
      (function(){
        try {
          const MARKER = 'lava_rapido_cache_cleared_v2';
          if (!localStorage.getItem(MARKER)) {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(()=>{});
            }
            if (window.caches && caches.keys) {
              caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).catch(()=>{});
            }
            try { localStorage.setItem(MARKER, String(Date.now())); } catch(e){}
            // Slight delay then reload to get fresh assets
            setTimeout(()=>{ try{ location.reload(true); }catch(e){ location.reload(); } }, 120);
          }
        } catch(e){}
      })();
    </script>
    <link rel="manifest" href="/LavaRapido/manifest.json">
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Try loading a list of possible bundle names (helps clients with cached manifests)
      (async function(){
        try{
          const candidates = [
            'index-DtgCEqaA.js',
            'index-Y8MFOx2a.js',
            'index-CJ1pJUGm.js',
            'index-lyPIW6Gm.js',
            'index-fAASfzzn.js'
          ];
          const basePath = '/LavaRapido/assets/';
          const fetchOptions = { method: 'HEAD', cache: 'no-store' };
          let chosen = null;
          for (const name of candidates) {
            try {
              const url = basePath + name + '?v=' + Date.now();
              const res = await fetch(url, fetchOptions);
              if (res && res.ok) { chosen = url; break; }
            } catch (e) {
              // ignore and try next
            }
          }
          // Fallback to the most recent known bundle if none responded
          if (!chosen) chosen = basePath + 'index-lyPIW6Gm.js' + '?v=' + Date.now();
          const s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = chosen;
          document.body.appendChild(s);
        } catch(e) { console.error('Failed to load app bundle', e); }
      })();
    </script>
  </body>
</html>
